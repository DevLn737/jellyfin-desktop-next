name: SyncPlay harness

on:
  push:
    branches: [main]
    paths:
      - 'tools/syncplay-harness/**'
      - '.github/workflows/syncplay-harness.yml'
  pull_request:
    paths:
      - 'tools/syncplay-harness/**'
      - '.github/workflows/syncplay-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncplay-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Fork server + Web in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # publish the server/web payloads to a release on main
    defaults:
      run:
        working-directory: tools/syncplay-harness
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Exposes the cache service token so plain `docker buildx` can use type=gha.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build server and Web payloads (cached by fork commit)
        run: |
          for part in server web; do
            docker buildx build server --target "$part-dist" \
              --cache-from "type=gha,scope=$part" --cache-to "type=gha,mode=max,scope=$part" \
              --output "type=local,dest=payload/$part"
          done

      - name: Build test server image
        run: |
          docker buildx build server --target runtime --load -t jellyfin-syncplay-test:local \
            --build-context server-dist=payload/server --build-context web-dist=payload/web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/syncplay-harness/package-lock.json

      - name: Install harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start and bootstrap the server
        run: scripts/server-up.sh

      - name: Run scenarios
        run: node src/run.mjs --out out

      - name: Job summary
        if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Server log
        if: failure()
        run: docker logs jfd-syncplay-test 2>&1 | tail -300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syncplay-report
          path: tools/syncplay-harness/out/

      - name: Publish payloads for sandboxes without a full build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf server.tar.gz -C payload/server .
          tar -czf web.tar.gz -C payload/web .
          tag=syncplay-test-server
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "SyncPlay test server payloads" \
              --notes "Server and Web 12.2 fork builds for tools/syncplay-harness (PAYLOAD=release). Not an end-user release."
          fi
          gh release upload "$tag" server.tar.gz web.tar.gz --clobber
