name: Library screens

# The sign-in, home, library, item and search screens in a window
# (offscreen), driven against Jellyfin 12.2 in Docker: sign in, open a
# library, a series, an episode, Play and Watch together, search, sign out.
# Screenshots of each screen are kept as an artifact.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  screens:
    name: Library screens (Jellyfin 12.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned versions
        id: pins
        run: |
          echo "qt=$(jq -r .qt.version deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "qt-arch=$(jq -r .qt.linuxArch deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "libmpv-deb=$(jq -r '.linux.libmpvPackage + "=" + .linux.libmpvPackageVersion' deps/versions.json)" >> "$GITHUB_OUTPUT"

      - name: Install Qt ${{ steps.pins.outputs.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ steps.pins.outputs.qt-arch }}
          modules: qtwebsockets
          cache: true

      - name: Install libmpv and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ steps.pins.outputs.libmpv-deb }} ninja-build libsecret-1-dev \
            libgl1-mesa-dev libegl1 libfontconfig1 libxkbcommon-x11-0 fonts-dejavu-core

      - name: Start the server
        run: scripts/test-server/stock-server.sh up | tee -a "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_REQUIRE_QT=ON -DJFD_SERVER_TESTS=ON

      - name: Build
        run: cmake --build build --parallel --target jfd_ui_library_server_tests

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          JFD_UI_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: ctest --test-dir build --output-on-failure -V -R jfd_ui_library_server_tests

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-screens
          path: screenshots
          if-no-files-found: ignore

      - name: Server log on failure
        if: failure()
        run: docker logs --tail 200 jfd-test-server || true
