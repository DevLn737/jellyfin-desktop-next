name: CI

# The Qt-free core on Windows and Linux, and every module under AddressSanitizer
# and UndefinedBehaviorSanitizer on Linux: the core alone, then the Qt modules
# and the application's tests with the pinned Qt and libmpv. macOS is not a
# target (docs/adr/0001-stack.md) and is not built.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4

  sanitizers:
    name: Core with ASan and UBSan (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DJFD_SIM_SCENARIOS=1000
          "-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 -E "^mutation_"

  # The Qt modules (API client, library, playback, integrations and the
  # updaters, settings, seerr, music, session) and the application's UI tests
  # under ASan and UBSan. JFD_REQUIRE_QT makes a missing Qt fail the configure
  # step instead of silently leaving these out, as the job above does.
  sanitizers-qt:
    name: Qt modules and app with ASan and UBSan (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The sanitizers cover our code; Qt, Mesa and libmpv are not
      # instrumented. Leaks that live only inside uninstrumented system
      # libraries are listed (and explained) in the suppressions file.
      ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:print_suppressions=1
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned versions
        id: pins
        run: |
          echo "qt=$(jq -r .qt.version deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "qt-arch=$(jq -r .qt.linuxArch deps/versions.json)" >> "$GITHUB_OUTPUT"

      - name: Install Qt ${{ steps.pins.outputs.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ steps.pins.outputs.qt-arch }}
          modules: qtwebsockets
          cache: true

      # After Qt: install-qt-action sets PKG_CONFIG_PATH.
      - name: Pinned libmpv
        uses: ./.github/actions/linux-libmpv

      - name: Install display libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libfontconfig1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DJFD_SIM_SCENARIOS=1000
          -DJFD_REQUIRE_QT=ON -DJFD_BUILD_APP=ON -DJFD_ENFORCE_PINS=ON
          "-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      # The simulator and the mutants already ran in the job above. The UI
      # tests run on Xvfb with Mesa, as in app.yml.
      - name: Test
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24"
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 900
          -E "^(mutation_|simulator_)"

      - name: Check that the Qt modules were tested
        run: |
          # A configure that quietly skipped them would pass the step above.
          tests=$(ctest --test-dir build -N -E "^(mutation_|simulator_)" | sed -nE 's/^ *Test +#[0-9]+: //p')
          echo "$tests"
          for name in jfd_api_tests jfd_library_tests jfd_playback_tests jfd_integrations_tests \
                      jfd_settings_tests jfd_seerr_tests jfd_music_tests jfd_session_runtime_tests jfd_remote_tests jfd_offline_tests \
                      jfd_ui_tests jfd_ui_library_tests jfd_ui_player_tests jfd_ui_shell_page_tests desktop_smoke \
                      jfd_platform_gamepad_tests jfd_ui_gamepad_tests; do
            grep -qx "$name" <<< "$tests" || { echo "::error::$name was not built"; exit 1; }
          done
          count=$(grep -c . <<< "$tests")
          echo "$count tests"
          test "$count" -ge 20
