name: Server plugins

# Builds the Jellyfin server plugins of the project's plugin repository (Room
# Members from server-plugin/, Shikimori from the DevLn737 fork), tests them
# on a throwaway stock Jellyfin 12.2, and on main publishes the repository:
# the zips and manifest.json as assets of the `jellyfin-plugins` release.
# Server owners add
#   https://github.com/DevLn737/jellyfin-desktop-next/releases/download/jellyfin-plugins/manifest.json
# under Dashboard -> Plugins -> Repositories. Run it by hand (workflow_dispatch)
# to pick up new Shikimori commits.

on:
  push:
    branches: [main]
    paths:
      - 'server-plugin/**'
      - '.github/workflows/server-plugin.yml'
  pull_request:
    paths:
      - 'server-plugin/**'
      - '.github/workflows/server-plugin.yml'
  workflow_dispatch:
    inputs:
      shikimori_ref:
        description: Branch, tag or commit of DevLn737/jellyfin-plugin-shikimori
        default: compatibility/12.2

permissions:
  contents: read

concurrency:
  group: server-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: Build, test and publish the plugin repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # the jellyfin-plugins release, on main only
    env:
      SHIKIMORI_REF: ${{ inputs.shikimori_ref || 'compatibility/12.2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: DevLn737/jellyfin-plugin-shikimori
          ref: ${{ env.SHIKIMORI_REF }}
          path: shikimori

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Room Members
        run: dotnet publish server-plugin/Jellyfin.Plugin.RoomMembers -c Release -o out/room-members

      - name: Build and test Shikimori
        working-directory: shikimori
        run: |
          dotnet test Jellyfin.Plugin.Shikimori.Tests
          dotnet publish Jellyfin.Plugin.Shikimori -c Release -o ../out/shikimori

      - name: Package
        run: |
          version() { sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' "$1"; }
          mkdir -p dist
          rm=$(version server-plugin/Jellyfin.Plugin.RoomMembers/Jellyfin.Plugin.RoomMembers.csproj)
          sk=$(version shikimori/Jellyfin.Plugin.Shikimori/Jellyfin.Plugin.Shikimori.csproj)
          (cd out/room-members && zip -q "../../dist/room-members_${rm}.zip" Jellyfin.Plugin.RoomMembers.dll)
          (cd out/shikimori && zip -q "../../dist/shikimori_${sk}.zip" Jellyfin.Plugin.Shikimori.dll Newtonsoft.Json.dll)
          ls -l dist

      - name: Room Members on stock Jellyfin 12.2
        run: server-plugin/smoke-test.sh out/room-members

      - name: Install both from the repository on stock Jellyfin 12.2
        run: server-plugin/repository/repository-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugins
          path: dist/
          retention-days: 30

      - name: Publish the plugin repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=jellyfin-plugins
          python3 server-plugin/repository/manifest.py \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" dist > dist/manifest.json
          cat dist/manifest.json
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # A pre-release with a non-v tag: the app's update check and the
            # "latest release" link never pick it.
            gh release create "$tag" --prerelease --title "Jellyfin server plugins" \
              --notes "Plugin repository for Jellyfin 12.2 servers: Room Members (watch-together members' time and ping for Jellyfin Desktop Next) and Shikimori. In Jellyfin: Dashboard -> Plugins -> Repositories -> add https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/manifest.json, then install from the catalog. Not an app release."
          fi
          # Old zips stay downloadable for servers that installed them.
          gh release upload "$tag" dist/*.zip dist/manifest.json --clobber
