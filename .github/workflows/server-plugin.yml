name: Room Members server plugin

on:
  push:
    branches: [main]
    paths:
      - 'server-plugin/**'
      - '.github/workflows/server-plugin.yml'
  pull_request:
    paths:
      - 'server-plugin/**'
      - '.github/workflows/server-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Build and smoke-test on stock Jellyfin 12.2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish server-plugin/Jellyfin.Plugin.RoomMembers -c Release -o server-plugin/out

      - name: Smoke test
        run: server-plugin/smoke-test.sh server-plugin/out

      - uses: actions/upload-artifact@v4
        with:
          name: room-members-plugin
          path: server-plugin/out/Jellyfin.Plugin.RoomMembers.dll
          retention-days: 30
