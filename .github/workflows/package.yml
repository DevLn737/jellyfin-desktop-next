name: Package

# Builds the Windows installer (MSI) and the Linux AppImage from the pinned
# dependencies in deps/versions.json, installs and runs them, and keeps them as
# workflow artifacts. Nothing is published: releases need the owner's consent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The application target packed (src/desktop), the file it builds, and the
  # packages' name.
  APP_TARGET: jellyfin-desktop
  APP_EXE: jellyfin-desktop
  APP_PACKAGE: jellyfin-desktop-next
  # Scanned for QML imports to deploy.
  APP_QML_DIR: src

jobs:
  msi:
    name: MSI (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\([A-Za-z]+ VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: build/deps
          key: windows-deps-${{ hashFiles('deps/versions.json') }}

      - name: Fetch pinned Qt, libmpv and Vulkan loader
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF `
            -DJFD_ENFORCE_PINS=ON "-DMPV_INCLUDE_DIR=$env:MPV_INCLUDE_DIR" "-DMPV_LIBRARY=$env:MPV_LIBRARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel --target $env:APP_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt and libmpv next to the executable
        shell: pwsh
        run: |
          $stage = 'build/package/app'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Where Qt puts it depends on the generator and the QML module setup.
          $exe = Get-ChildItem build -Recurse -Filter "$env:APP_EXE.exe" |
            Where-Object { $_.FullName -notlike '*package*' } | Select-Object -First 1
          if (-not $exe) { throw "$env:APP_EXE.exe was not built" }
          Copy-Item $exe.FullName $stage
          windeployqt --release --compiler-runtime --qmldir $env:APP_QML_DIR --no-translations "$stage/$env:APP_EXE.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:JFD_RUNTIME_DIR/*.dll" $stage
          @{ commit = '${{ github.sha }}'; ref = '${{ github.ref_name }}'; run = '${{ github.run_id }}' } |
            ConvertTo-Json | Set-Content -Encoding ASCII "$stage/build-info.json"

      - name: Build MSI
        shell: pwsh
        run: >
          ./packaging/windows/build-msi.ps1 -Deployment build/package/app
          -Version ${{ steps.version.outputs.version }} -ExeName "$env:APP_EXE.exe"
          -Output "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.version }}-x64.msi"

      - name: Install, run and uninstall
        shell: pwsh
        run: >
          ./packaging/windows/test-msi.ps1 -Msi "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.version }}-x64.msi"
          -Logs build/package/msi-logs -ExeName "$env:APP_EXE.exe"

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: build/package/msi-logs
          retention-days: 7

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-windows-msi
          path: build/package/*.msi
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime libraries for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Read pinned versions
        id: pins
        run: |
          echo "qt=$(jq -r .qt.version deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "qt-arch=$(jq -r .qt.linuxArch deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -nE 's/^project\([A-Za-z]+ VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Qt ${{ steps.pins.outputs.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ steps.pins.outputs.qt-arch }}
          cache: true

      # After Qt: install-qt-action sets PKG_CONFIG_PATH.
      - name: Pinned libmpv
        uses: ./.github/actions/linux-libmpv

      - name: Build
        run: |
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_RPATH="${{ github.workspace }}/build/libmpv/lib"
          cmake --build build/app --parallel --target "$APP_TARGET"

      - name: Build AppImage
        env:
          JFD_PACKAGE_VERSION: ${{ steps.pins.outputs.version }}
        run: |
          exe=$(find build/app -type f -name "$APP_EXE" -perm -u+x | head -1)
          test -n "$exe"
          packaging/linux/build-appimage.sh "$exe" "$APP_QML_DIR" build/libmpv build/package
          ls -la build/package

      - name: Smoke test on the build system
        run: |
          appimage=$(ls build/package/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$appimage" --smoke

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: build/package/*.AppImage
          if-no-files-found: error
          retention-days: 30

  appimage-smoke:
    name: AppImage on ${{ matrix.image }}
    needs: appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: appimage
      - name: Smoke test (Xvfb, Mesa llvmpipe)
        run: |
          chmod +x appimage/*.AppImage
          bash packaging/linux/smoke-appimage.sh appimage/*.AppImage
