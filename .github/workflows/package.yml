name: Package

# Builds the Windows installer (MSI) and the Linux AppImage from the pinned
# dependencies in deps/versions.json, installs and runs them, and keeps them as
# workflow artifacts. Every file is signed with minisign (sign job). A tag
# v<version>[-<pre-release>] publishes the signed AppImage as a GitHub
# pre-release (release job); nothing else is published.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a pre-release from main under this tag (v<version>[-<pre-release>]); empty builds only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release tag: the pushed tag, or the "tag" input of a manual run on main.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
  # The application target packed (src/desktop), the file it builds, and the
  # packages' name.
  APP_TARGET: jellyfin-desktop
  APP_EXE: jellyfin-desktop
  APP_PACKAGE: jellyfin-desktop-next
  # Scanned for QML imports to deploy.
  APP_QML_DIR: src
  # The minisign public key built into the client; the matching secret key is
  # the MINISIGN_SECRET_KEY secret. Unset: the client installs no update.
  RELEASE_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
  # During a key rotation, the next key's public key: clients built with it
  # also accept releases signed with the next key. Empty otherwise (see
  # "Release signing" in packaging/README.md).
  RELEASE_NEXT_PUBLIC_KEY: ${{ vars.MINISIGN_NEXT_PUBLIC_KEY }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  msi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: MSI (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: build/deps
          key: windows-deps-${{ hashFiles('deps/versions.json') }}

      - name: Fetch pinned Qt, libmpv and Vulkan loader
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF `
            -DJFD_ENFORCE_PINS=ON "-DMPV_INCLUDE_DIR=$env:MPV_INCLUDE_DIR" "-DMPV_LIBRARY=$env:MPV_LIBRARY" `
            "-DJFD_VERSION_SUFFIX=${{ steps.version.outputs.suffix }}" "-DJFD_RELEASE_PUBLIC_KEY=$env:RELEASE_PUBLIC_KEY" `
            "-DJFD_RELEASE_NEXT_PUBLIC_KEY=$env:RELEASE_NEXT_PUBLIC_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel --target $env:APP_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt, libmpv and the licences next to the executable
        shell: pwsh
        run: |
          $stage = 'build/package/app'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Where Qt puts it depends on the generator and the QML module setup.
          $exe = Get-ChildItem build -Recurse -Filter "$env:APP_EXE.exe" |
            Where-Object { $_.FullName -notlike '*package*' } | Select-Object -First 1
          if (-not $exe) { throw "$env:APP_EXE.exe was not built" }
          Copy-Item $exe.FullName $stage
          windeployqt --release --compiler-runtime --qmldir $env:APP_QML_DIR --no-translations "$stage/$env:APP_EXE.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:JFD_RUNTIME_DIR/*.dll" $stage
          # Licences of everything in the package (packaging/licenses/THIRD-PARTY-NOTICES.txt).
          New-Item -ItemType Directory -Force -Path "$stage/licenses" | Out-Null
          Copy-Item LICENSE, LICENSES.md, packaging/licenses/*.txt "$stage/licenses"
          # Every DLL next to the executable has its notice there: Qt, libmpv,
          # the Vulkan loader, Mesa and Microsoft's redistributables (the
          # subfolders are windeployqt's: Qt's plugins and QML modules).
          # Another DLL stops the build until THIRD-PARTY-NOTICES.txt and a
          # licence text cover it.
          $known = @('Qt6*.dll', 'libmpv-2.dll', 'vulkan-1.dll', 'opengl32sw.dll', 'd3dcompiler_47.dll',
                     'dxcompiler.dll', 'dxil.dll', 'vcruntime140*.dll', 'msvcp140*.dll', 'concrt140.dll',
                     'vccorlib140.dll')
          $unlicensed = Get-ChildItem $stage -Filter *.dll | Where-Object {
            $name = $_.Name; -not ($known | Where-Object { $name -like $_ })
          }
          if ($unlicensed) { throw "No licence notice for: $($unlicensed.Name -join ', ') (packaging/licenses/THIRD-PARTY-NOTICES.txt)" }
          @{ commit = '${{ github.sha }}'; ref = '${{ github.ref_name }}'; run = '${{ github.run_id }}' } |
            ConvertTo-Json | Set-Content -Encoding ASCII "$stage/build-info.json"

      - name: Build MSI
        shell: pwsh
        run: >
          ./packaging/windows/build-msi.ps1 -Deployment build/package/app
          -Version ${{ steps.version.outputs.msi }} -DisplayVersion ${{ steps.version.outputs.version }}
          -ExeName "$env:APP_EXE.exe"
          -Output "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.base }}-x64.msi"

      - name: Install, run and uninstall
        shell: pwsh
        run: >
          ./packaging/windows/test-msi.ps1 -Msi "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.base }}-x64.msi"
          -Logs build/package/msi-logs -ExeName "$env:APP_EXE.exe"

      # The client's update script (src/integrations/apply-update.ps1, what
      # MsiUpdater writes and starts) against real packages: an older MSI of
      # the same build is installed, the script upgrades it to the MSI above
      # and starts the installed program; a broken package must roll back
      # and an older package must be refused as a downgrade.
      - name: Update with the client's script
        shell: pwsh
        env:
          QT_OPENGL: software
          MSI_VERSION: ${{ steps.version.outputs.msi }}
        run: |
          $new = [version]$env:MSI_VERSION
          if ($new.Build -lt 1) { throw "no older MSI version below $new" }
          $old = '{0}.{1}.{2}' -f $new.Major, $new.Minor, ($new.Build - 1)
          $oldMsi = "build/package-old/$env:APP_PACKAGE-old-x64.msi"
          ./packaging/windows/build-msi.ps1 -Deployment build/package/app -Version $old -DisplayVersion "$old (update test)" `
            -ExeName "$env:APP_EXE.exe" -Output $oldMsi
          ./packaging/windows/test-msi-update.ps1 -OldMsi $oldMsi -OldVersion $old `
            -NewMsi "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.base }}-x64.msi" -NewVersion $env:MSI_VERSION `
            -Script src/integrations/apply-update.ps1 -Logs build/package/msi-logs -ExeName "$env:APP_EXE.exe"

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: build/package/msi-logs
          retention-days: 5

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-windows-msi
          path: build/package/*.msi
          if-no-files-found: error
          retention-days: 5

  appimage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: AppImage (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime libraries for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Read pinned versions
        id: pins
        run: |
          echo "qt=$(jq -r .qt.version deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "qt-arch=$(jq -r .qt.linuxArch deps/versions.json)" >> "$GITHUB_OUTPUT"
          packaging/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Install Qt ${{ steps.pins.outputs.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ steps.pins.outputs.qt-arch }}
          modules: qtwebsockets
          cache: true

      # After Qt: install-qt-action sets PKG_CONFIG_PATH.
      - name: Pinned libmpv
        uses: ./.github/actions/linux-libmpv

      - name: Build
        run: |
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_RPATH="${{ github.workspace }}/build/libmpv/lib" \
            -DJFD_VERSION_SUFFIX="${{ steps.pins.outputs.suffix }}" -DJFD_RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY" \
            -DJFD_RELEASE_NEXT_PUBLIC_KEY="$RELEASE_NEXT_PUBLIC_KEY"
          cmake --build build/app --parallel --target "$APP_TARGET"

      - name: Build AppImage
        env:
          JFD_PACKAGE_VERSION: ${{ steps.pins.outputs.version }}
        run: |
          exe=$(find build/app -type f -name "$APP_EXE" -perm -u+x | head -1)
          test -n "$exe"
          packaging/linux/build-appimage.sh "$exe" "$APP_QML_DIR" build/libmpv build/package
          ls -la build/package

      - name: Smoke test on the build system
        run: |
          appimage=$(ls build/package/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$appimage" --smoke

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: build/package/*.AppImage
          if-no-files-found: error
          retention-days: 5

  appimage-smoke:
    name: AppImage on ${{ matrix.image }}
    needs: appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: appimage
      - name: Smoke test (Xvfb, Mesa llvmpipe)
        run: |
          chmod +x appimage/*.AppImage
          bash packaging/linux/smoke-appimage.sh appimage/*.AppImage

  # After the AppImage ran on every distribution: nothing that failed there
  # is signed, and so nothing is published (release needs sign).
  #
  # The release key is used only by release runs (RELEASE_TAG set: a pushed
  # v* tag, or a manual run on main with a tag). Pull requests and plain
  # pushes to main sign with a throwaway key made here, so they check the same
  # steps without the key. Release runs use the "release" environment (GitHub
  # creates it on first use); keep MINISIGN_SECRET_KEY there as an environment
  # secret, limited to main and v* tags, so a workflow changed in a pull
  # request cannot read it either. A repository secret of that name still
  # works until it is moved.
  sign:
    name: Sign packages
    needs: [msi, appimage, appimage-smoke]
    runs-on: ubuntu-24.04
    # The same condition as RELEASE_TAG (env is not available here).
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '')) && 'release' || '' }}
    outputs:
      real-key: ${{ steps.sign.outputs.real }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_PACKAGE }}-*
          path: packages
          merge-multiple: true

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      # Before the key: no script from the checkout runs in a step that has it.
      - name: Read version
        id: version
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"

      # The key stays in this step's environment and reaches minisign through
      # a pipe; it is never written to disk. Its public key must be the
      # current key built into the client (MINISIGN_PUBLIC_KEY).
      - name: Sign and verify
        id: sign
        env:
          SECRET_KEY: ${{ env.RELEASE_TAG != '' && secrets.MINISIGN_SECRET_KEY || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$SECRET_KEY" ]; then
            minisign -R -s <(printf '%s\n' "$SECRET_KEY") -p release.pub
            if [ "$(sed -n 2p release.pub)" != "$RELEASE_PUBLIC_KEY" ]; then
              echo "::error::MINISIGN_SECRET_KEY does not match the MINISIGN_PUBLIC_KEY variable"
              exit 1
            fi
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            throwaway="$(mktemp -d)"
            minisign -G -W -s "$throwaway/key" -p release.pub
            SECRET_KEY="$(cat "$throwaway/key")"
            rm -rf "$throwaway"
            echo "real=false" >> "$GITHUB_OUTPUT"
            if [ -n "$RELEASE_TAG" ]; then
              echo "::warning::No MINISIGN_SECRET_KEY: signed with a throwaway key, nothing is published"
            else
              echo "::notice::Not a release run: signed with a throwaway key"
            fi
          fi
          cd packages
          # Release name first: the signature names the file.
          mv "$(ls *.AppImage | head -1)" "$APP_PACKAGE-$VERSION-x86_64.AppImage"
          [ "$(ls *.msi | head -1)" = "$APP_PACKAGE-$VERSION-x64.msi" ] \
            || mv "$(ls *.msi | head -1)" "$APP_PACKAGE-$VERSION-x64.msi"
          for file in *.msi *.AppImage; do
            # The client accepts a signature only when the trusted comment
            # names the file (ReleaseSignature.cpp).
            minisign -S -s <(printf '%s\n' "$SECRET_KEY") -m "$file" -t "file:$file"
            minisign -V -p ../release.pub -m "$file"
          done
          unset SECRET_KEY
          # A changed file must fail.
          cp "$(ls *.AppImage | head -1)" tampered
          printf 'x' | dd of=tampered bs=1 seek=4096 conv=notrunc status=none
          cp "$(ls *.AppImage | head -1).minisig" tampered.minisig
          if minisign -V -p ../release.pub -m tampered -x tampered.minisig; then
            echo "::error::a tampered file passed the signature check"
            exit 1
          fi
          rm tampered tampered.minisig
          sha256sum *.msi *.AppImage > SHA256SUMS
          cp ../release.pub minisign.pub
          ls -la

      - name: Upload signed packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-signed
          path: packages
          if-no-files-found: error
          retention-days: 5

  # A tag v<version>[-<pre-release>] publishes the AppImage, its signature and
  # the checksums as a GitHub pre-release. Only with the real key.
  release:
    name: Publish pre-release
    needs: sign
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and tags, for the change list in the notes.
          fetch-depth: 0
      - name: Check the version
        id: version
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"
      - name: Require the release key
        if: needs.sign.outputs.real-key != 'true'
        run: |
          echo "::error::No MINISIGN_SECRET_KEY secret in the release environment: nothing is published"
          exit 1
      # Every workflow that runs on a push to main must have passed for this
      # commit. Runs still going are waited for, up to an hour each. Those
      # with a paths filter run only when their files change: when they ran
      # for this commit they must have passed, when not they are skipped.
      # A new workflow that runs on push to main goes in one of the lists.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          always="ci.yml app.yml session.yml api.yml library-ui.yml syncplay-drift.yml"
          when_changed="seerr-api.yml syncplay-harness.yml"
          for workflow in $always $when_changed; do
            for attempt in $(seq 1 60); do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0] // {} | [.status // "missing", .conclusion // "none", .html_url // ""] | join("|")')
              IFS='|' read -r status conclusion url <<< "$run"
              if [ "$status" = "completed" ] || [ "$status" = "missing" ]; then break; fi
              echo "$workflow: $status, waiting ($url)"
              sleep 60
            done
            if [ "$status" = "missing" ]; then
              case " $when_changed " in
                *" $workflow "*)
                  echo "$workflow: did not run for $GITHUB_SHA (its files did not change)"
                  continue ;;
              esac
              echo "::error::$workflow has no run for $GITHUB_SHA on a push to main: release from a commit on main"
              exit 1
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow is '$status/$conclusion' for $GITHUB_SHA ($url): nothing is published"
              exit 1
            fi
            echo "$workflow: success ($url)"
          done
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-signed
          path: packages
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # What changed since the previous client tag, how to install, and
          # the SmartScreen warning for the MSI without a code-signing certificate.
          packaging/release-notes.sh "$RELEASE_TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          cd packages
          name="$APP_PACKAGE-$VERSION-x86_64.AppImage"
          msi="$APP_PACKAGE-$VERSION-x64.msi"
          grep -E " ($name|$msi)\$" SHA256SUMS > SHA256SUMS.txt
          # A release made from the tag by hand (gh release create) gets the files.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "Jellyfin Desktop $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$RELEASE_TAG" --clobber "$name" "$name.minisig" "$msi" "$msi.minisig" SHA256SUMS.txt minisign.pub
          else
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Jellyfin Desktop $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
              "$name" "$name.minisig" "$msi" "$msi.minisig" SHA256SUMS.txt minisign.pub
          fi
