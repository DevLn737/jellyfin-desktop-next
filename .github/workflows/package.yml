name: Package

# Builds the Windows installer (MSI) and the Linux AppImage from the pinned
# dependencies in deps/versions.json, installs and runs them, and keeps them as
# workflow artifacts. Every file is signed with minisign (sign job). A tag
# v<version>[-<pre-release>] publishes the signed AppImage as a GitHub
# pre-release (release job); nothing else is published.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The application target packed (src/desktop), the file it builds, and the
  # packages' name.
  APP_TARGET: jellyfin-desktop
  APP_EXE: jellyfin-desktop
  APP_PACKAGE: jellyfin-desktop-next
  # Scanned for QML imports to deploy.
  APP_QML_DIR: src
  # The minisign public key built into the client; the matching secret key is
  # the MINISIGN_SECRET_KEY secret. Unset: the client installs no update.
  RELEASE_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}

jobs:
  msi:
    name: MSI (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: build/deps
          key: windows-deps-${{ hashFiles('deps/versions.json') }}

      - name: Fetch pinned Qt, libmpv and Vulkan loader
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF `
            -DJFD_ENFORCE_PINS=ON "-DMPV_INCLUDE_DIR=$env:MPV_INCLUDE_DIR" "-DMPV_LIBRARY=$env:MPV_LIBRARY" `
            "-DJFD_VERSION_SUFFIX=${{ steps.version.outputs.suffix }}" "-DJFD_RELEASE_PUBLIC_KEY=$env:RELEASE_PUBLIC_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel --target $env:APP_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt and libmpv next to the executable
        shell: pwsh
        run: |
          $stage = 'build/package/app'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Where Qt puts it depends on the generator and the QML module setup.
          $exe = Get-ChildItem build -Recurse -Filter "$env:APP_EXE.exe" |
            Where-Object { $_.FullName -notlike '*package*' } | Select-Object -First 1
          if (-not $exe) { throw "$env:APP_EXE.exe was not built" }
          Copy-Item $exe.FullName $stage
          windeployqt --release --compiler-runtime --qmldir $env:APP_QML_DIR --no-translations "$stage/$env:APP_EXE.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:JFD_RUNTIME_DIR/*.dll" $stage
          @{ commit = '${{ github.sha }}'; ref = '${{ github.ref_name }}'; run = '${{ github.run_id }}' } |
            ConvertTo-Json | Set-Content -Encoding ASCII "$stage/build-info.json"

      - name: Build MSI
        shell: pwsh
        run: >
          ./packaging/windows/build-msi.ps1 -Deployment build/package/app
          -Version ${{ steps.version.outputs.base }} -ExeName "$env:APP_EXE.exe"
          -Output "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.base }}-x64.msi"

      - name: Install, run and uninstall
        shell: pwsh
        run: >
          ./packaging/windows/test-msi.ps1 -Msi "build/package/$env:APP_PACKAGE-${{ steps.version.outputs.base }}-x64.msi"
          -Logs build/package/msi-logs -ExeName "$env:APP_EXE.exe"

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: build/package/msi-logs
          retention-days: 7

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-windows-msi
          path: build/package/*.msi
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime libraries for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Read pinned versions
        id: pins
        run: |
          echo "qt=$(jq -r .qt.version deps/versions.json)" >> "$GITHUB_OUTPUT"
          echo "qt-arch=$(jq -r .qt.linuxArch deps/versions.json)" >> "$GITHUB_OUTPUT"
          packaging/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Install Qt ${{ steps.pins.outputs.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ steps.pins.outputs.qt-arch }}
          cache: true

      # After Qt: install-qt-action sets PKG_CONFIG_PATH.
      - name: Pinned libmpv
        uses: ./.github/actions/linux-libmpv

      - name: Build
        run: |
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_APP=ON -DJFD_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_RPATH="${{ github.workspace }}/build/libmpv/lib" \
            -DJFD_VERSION_SUFFIX="${{ steps.pins.outputs.suffix }}" -DJFD_RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY"
          cmake --build build/app --parallel --target "$APP_TARGET"

      - name: Build AppImage
        env:
          JFD_PACKAGE_VERSION: ${{ steps.pins.outputs.version }}
        run: |
          exe=$(find build/app -type f -name "$APP_EXE" -perm -u+x | head -1)
          test -n "$exe"
          packaging/linux/build-appimage.sh "$exe" "$APP_QML_DIR" build/libmpv build/package
          ls -la build/package

      - name: Smoke test on the build system
        run: |
          appimage=$(ls build/package/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$appimage" --smoke

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: build/package/*.AppImage
          if-no-files-found: error
          retention-days: 30

  appimage-smoke:
    name: AppImage on ${{ matrix.image }}
    needs: appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-linux-appimage
          path: appimage
      - name: Smoke test (Xvfb, Mesa llvmpipe)
        run: |
          chmod +x appimage/*.AppImage
          bash packaging/linux/smoke-appimage.sh appimage/*.AppImage

  sign:
    name: Sign packages
    needs: [msi, appimage]
    runs-on: ubuntu-24.04
    outputs:
      real-key: ${{ steps.key.outputs.real }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_PACKAGE }}-*
          path: packages
          merge-multiple: true

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      # The release key when the secret exists (pushes to this repository),
      # otherwise a throwaway key made here, so pull requests check the same
      # steps. Its public key must be the one built into the client.
      - name: Signing key
        id: key
        env:
          SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/minisign"
          key="$RUNNER_TEMP/minisign/release.key"
          if [ -n "$SECRET_KEY" ]; then
            printf '%s\n' "$SECRET_KEY" > "$key"
            minisign -R -s "$key" -p release.pub
            if [ "$(sed -n 2p release.pub)" != "$RELEASE_PUBLIC_KEY" ]; then
              echo "::error::MINISIGN_SECRET_KEY does not match the MINISIGN_PUBLIC_KEY variable"
              exit 1
            fi
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            minisign -G -W -s "$key" -p release.pub
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MINISIGN_SECRET_KEY: signed with a throwaway key"
          fi
          echo "file=$key" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"

      - name: Sign and verify
        env:
          KEY: ${{ steps.key.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd packages
          # Release name first: the signature names the file.
          mv "$(ls *.AppImage | head -1)" "$APP_PACKAGE-$VERSION-x86_64.AppImage"
          for file in *.msi *.AppImage; do
            # The client accepts a signature only when the trusted comment
            # names the file (ReleaseSignature.cpp).
            minisign -S -s "$KEY" -m "$file" -t "file:$file"
            minisign -V -p ../release.pub -m "$file"
          done
          # A changed file must fail.
          cp "$(ls *.AppImage | head -1)" tampered
          printf 'x' | dd of=tampered bs=1 seek=4096 conv=notrunc status=none
          cp "$(ls *.AppImage | head -1).minisig" tampered.minisig
          if minisign -V -p ../release.pub -m tampered -x tampered.minisig; then
            echo "::error::a tampered file passed the signature check"
            exit 1
          fi
          rm tampered tampered.minisig
          rm -f "$KEY"
          sha256sum *.msi *.AppImage > SHA256SUMS
          cp ../release.pub minisign.pub
          ls -la

      - name: Upload signed packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-signed
          path: packages
          if-no-files-found: error
          retention-days: 30

  # A tag v<version>[-<pre-release>] publishes the AppImage, its signature and
  # the checksums as a GitHub pre-release. Only with the real key.
  release:
    name: Publish pre-release
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        id: version
        run: packaging/release-version.sh >> "$GITHUB_OUTPUT"
      - name: Require the release key
        if: needs.sign.outputs.real-key != 'true'
        run: |
          echo "::error::No MINISIGN_SECRET_KEY secret: nothing is published"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_PACKAGE }}-signed
          path: packages
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd packages
          name="$APP_PACKAGE-$VERSION-x86_64.AppImage"
          grep " $name\$" SHA256SUMS > SHA256SUMS.txt
          notes="Pre-release for testing. Linux AppImage: make it executable and run it. The file is signed with minisign (minisign.pub); SHA-256 in SHA256SUMS.txt."
          # A release made from the tag by hand (gh release create) gets the files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --prerelease --title "Jellyfin Desktop $VERSION" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" --clobber "$name" "$name.minisig" SHA256SUMS.txt minisign.pub
          else
            gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
              --title "Jellyfin Desktop $VERSION" --notes "$notes" \
              "$name" "$name.minisig" SHA256SUMS.txt minisign.pub
          fi
