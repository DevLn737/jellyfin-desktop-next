name: SyncPlay drift

# Our client's SyncPlay logic (core + syncplay, headless agent) in a live group
# with the harness's reference participant and Jellyfin Web in Chromium, on the
# forked 12.2 server and on stock 12.2. The report goes to the job summary and,
# on pull requests, to one comment that is updated on every push.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly long run
  workflow_dispatch:
    inputs:
      long_minutes:
        description: 'Also run the long drift check on the forked server for this many minutes (0 = off)'
        default: '0'

permissions:
  contents: read

concurrency:
  # Long runs (dispatch, schedule) must not be cancelled by pushes to main.
  group: syncplay-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Drift (${{ matrix.server }} server)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        server: [fork, stock]
    steps:
      - uses: actions/checkout@v4

      - name: Build the agent
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJFD_BUILD_TESTS=OFF
          cmake --build build --target jfd_syncplay_agent

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/syncplay-harness/package-lock.json

      - name: Install harness
        working-directory: tools/syncplay-harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@v3
        if: matrix.server == 'fork'

      # Exposes the cache service token so plain `docker buildx` can use type=gha.
      - uses: crazy-max/ghaction-github-runtime@v3
        if: matrix.server == 'fork'

      # Same cache scopes as the harness workflow: built once per fork commit.
      - name: Build server and Web payloads (cached by fork commit)
        if: matrix.server == 'fork'
        working-directory: tools/syncplay-harness
        run: |
          for part in server web; do
            docker buildx build server --target "$part-dist" \
              --cache-from "type=gha,scope=$part" --cache-to "type=gha,mode=max,scope=$part" \
              --output "type=local,dest=payload/$part"
          done

      - name: Start the forked server
        if: matrix.server == 'fork'
        working-directory: tools/syncplay-harness
        run: PAYLOAD="$PWD/payload" scripts/server-up.sh

      - name: Start the stock server
        if: matrix.server == 'stock'
        run: tools/syncplay-agent/scripts/stock-server-up.sh

      - name: Run scenarios
        env:
          LONG: ${{ matrix.server == 'fork' && (github.event_name == 'schedule' && '30' || inputs.long_minutes) || '0' }}
        run: |
          extra=()
          if [ "${LONG:-0}" != 0 ]; then extra=(--long "$LONG"); fi
          node tools/syncplay-agent/run.mjs --agent build/tools/syncplay-agent/jfd_syncplay_agent \
            --server ${{ matrix.server }} --out out/${{ matrix.server }} "${extra[@]}"

      - name: Job summary
        if: always()
        run: cat out/${{ matrix.server }}/drift-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Server log
        if: failure()
        run: docker logs $(docker ps -aq | head -1) 2>&1 | tail -300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report-${{ matrix.server }}
          path: out/${{ matrix.server }}/

  comment:
    name: Drift report comment
    needs: drift
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drift-report-*
          path: reports
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- syncplay-drift-report -->';
            const parts = [];
            for (const server of ['fork', 'stock']) {
              const file = `reports/drift-report-${server}/drift-report.md`;
              parts.push(fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : `# ${server} server\n\nNo report: the job failed before the scenarios ran.\n`);
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${parts.join('\n')}\n[Workflow run](${run}) · commit ${context.payload.pull_request.head.sha.slice(0, 7)}\n`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
